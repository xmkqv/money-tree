[project]
name = "money-tree-decide"
version = "0.1.0"
description = "Position decision contracts for money-tree"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["money-tree-data>=0.1.0", "money-tree-predict>=0.1.0"]
keywords = ["algorithmic-trading", "portfolio-management", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
money-tree-data = { workspace = true }
money-tree-predict = { workspace = true }

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[tool.uv.build-backend]
module-name = "money_tree.decide"
