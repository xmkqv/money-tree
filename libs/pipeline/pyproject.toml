[project]
name = "money-tree"
version = "0.1.0"
description = "Typed orchestration for the money-tree trading pipeline"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "money-tree-data>=0.1.0",
    "money-tree-predict>=0.1.0",
    "money-tree-decide>=0.1.0",
    "money-tree-execute>=0.1.0",
]
keywords = ["algorithmic-trading", "pipeline", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
money-tree-data = { workspace = true }
money-tree-predict = { workspace = true }
money-tree-decide = { workspace = true }
money-tree-execute = { workspace = true }

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[tool.uv.build-backend]
module-name = "money_tree.pipeline"
