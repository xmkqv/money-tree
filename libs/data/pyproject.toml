[project]
name = "money-tree-data"
version = "0.1.0"
description = "Market data contracts for money-tree"
license = "MIT"
requires-python = ">=3.13"
keywords = ["algorithmic-trading", "market-data", "typing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[tool.uv.build-backend]
module-name = "money_tree.data"
