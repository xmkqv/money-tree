[project]
name = "money-tree"
version = "0.1.0"
description = "A two-strategy risk-limited trading system"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "alpaca-py>=0.44,<1",
    "lumibot>=4,<5",
    "polars>=1,<2",
]
keywords = ["algorithmic-trading", "alpaca", "lumibot", "systematic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
money-tree = "money_tree.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[dependency-groups]
dev = [
    "arch>=8,<9",
    "numpy>=2,<3",
    "ruff>=0.16",
    "ty>=0.0.69",
]

[tool.hatch.build.targets.sdist]
include = ["src/money_tree", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/money_tree"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ty.src]
include = ["src/money_tree", "research"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "lumibot.backtesting",
    "lumibot.brokers",
    "lumibot.entities",
    "lumibot.strategies",
]
