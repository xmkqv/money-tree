[project]
name = "money-tree"
version = "0.1.0"
description = "Four US-equity trading strategies, written down first and then run: backtesting, multi-strategy portfolio composition, and Alpaca execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "alpaca-py>=0.44",
    "authlib>=1.8",
    "exchange-calendars>=4.13",
    "fastapi>=0.141",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "lumibot>=4.5.90",
    "pandas>=2.3",
    "pandas-ta-classic>=0.6",
    "pydantic>=2.12",
    "pydantic-settings>=2.15",
    "starlette>=0.52",
    "typer>=0.27",
    "uvicorn>=0.52",
]
[project.scripts]
mt = "mt.cli.__main__:app"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas-stubs>=2.3",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.16",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedFunction = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2
known-first-party = ["mt", "tests"]

[tool.hatch.build.targets.sdist]
include = ["src/mt", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt"]
