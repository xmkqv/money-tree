[project]
name = "money-tree"
version = "0.1.0"
description = "Lumibot strategy runner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "authlib>=1.6,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "lumibot>=4,<5",
    "pydantic-settings>=2,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]
[project.scripts]
mt = "cli.__main__:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "arch>=8,<9",
    "polars>=1,<2",
    "pyright>=1.1,<2",
    "ruff>=0.14,<1",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedFunction = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.hatch.build.targets.sdist]
include = ["src/bot", "src/cli", "src/ui", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "src/cli", "src/ui"]
