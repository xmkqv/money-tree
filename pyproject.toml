[dependency-groups]
dev = [
    "mypy>=2.3",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.uv.workspace]
members = ["libs/*"]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = [
    "libs/data/src",
    "libs/predict/src",
    "libs/decide/src",
    "libs/execute/src",
    "libs/pipeline/src",
    "tests",
]
explicit_package_bases = true
mypy_path = [
    "libs/data/src",
    "libs/predict/src",
    "libs/decide/src",
    "libs/execute/src",
    "libs/pipeline/src",
]
