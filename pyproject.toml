[project]
name = "money-tree"
version = "0.1.0"
description = "Six US-equity trading strategies, written down first and then run: backtesting, multi-strategy portfolio composition, and Alpaca execution."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "alpaca-py>=0.44",
    "authlib>=1.8",
    "cachetools>=7.2",
    "exchange-calendars>=4.13",
    "fastapi>=0.141",
    "httpx2>=2.13",
    "itsdangerous>=2.2",
    "joserfc>=1.7",
    "limits>=5.8",
    "lumibot>=4.6",
    "pandas>=2.3",
    "pandas-ta-classic>=0.8",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "redis>=8.1",
    "starlette>=1.7",
    "typer>=0.27",
    "uvicorn>=0.54",
]
[project.scripts]
mt = "mt.cli.__main__:app"

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0",
    "pyright>=1.1",
    "ruff>=0.16",
]

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnusedFunction = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.hatch.build.targets.sdist]
include = ["src/mt", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/mt"]
