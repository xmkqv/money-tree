[project]
name = "money-tree"
version = "0.1.0"
description = "A live NautilusTrader node"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "nautilus-trader[visualization]>=1.231,<2",
]
keywords = ["algorithmic-trading", "nautilus-trader", "live-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.scripts]
money-tree = "money_tree.node:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.69",
]

# Flat layout: the package sits at the repository root, not under `src`.
[tool.hatch.build.targets.wheel]
packages = ["money_tree"]

[tool.hatch.build.targets.sdist]
include = ["money_tree", "LICENSE", "README.md", "pyproject.toml"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["money_tree"]
