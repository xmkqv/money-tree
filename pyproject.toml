[project]
name = "money-tree"
version = "0.1.0"
description = "A live NautilusTrader node"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "lumibot>=4.5.26",
    "nautilus-trader[ib]>=1.231,<2",
    "plotly>=6.9.0",
]
keywords = ["algorithmic-trading", "nautilus-trader", "live-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
money-tree = "money_tree._nautilus_trader.node:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[dependency-groups]
dev = [
    "ruff>=0.16",
    "ty>=0.0.69",
]
demo = [
    "alpaca-py>=0.44,<1",
    "tradingagents",
]

[tool.uv.sources]
tradingagents = { git = "https://github.com/TauricResearch/TradingAgents" }

[tool.hatch.build.targets.sdist]
include = ["money_tree", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ty.src]
include = ["money_tree"]

[tool.ty.analysis]
allowed-unresolved-imports = [
    "nautilus_trader.core.correctness",
    "nautilus_trader.core.message",
    "nautilus_trader.model.data",
    "nautilus_trader.model.identifiers",
    "nautilus_trader.trading.strategy",
]
