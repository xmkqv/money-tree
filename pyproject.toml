[project]
name = "money-tree"
version = "0.1.0"
description = "Lumibot strategy runner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.15"
dependencies = [
    "authlib>=1.6,<2",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "itsdangerous>=2.2,<3",
    "lumibot>=4,<5",
    "pydantic-settings>=2,<3",
    "typer>=0.16,<1",
    "uvicorn>=0.35,<1",
]
keywords = ["algorithmic-trading", "alpaca", "lumibot", "systematic-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
mt = "cli.__main__:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/xmkqv/money-tree"
Issues = "https://github.com/xmkqv/money-tree/issues"

[dependency-groups]
dev = [
    "arch>=8,<9",
    "polars>=1,<2",
]

[tool.hatch.build.targets.sdist]
include = ["src/bot", "src/cli", "src/ui", "LICENSE", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/bot", "src/cli", "src/ui"]
