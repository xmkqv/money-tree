min_version = "2026.8.11"

[tools]
python = "3.13.15"
uv = "0.12.1"
node = "26.8.1"
railway = "5.47.2"

[vars]
mode = "{% if mise_env %}{{ mise_env | join(sep='') }}{% else %}{{ throw(message='no environment selected: rerun with --env development or --env production') }}{% endif %}"

[env]
MODE = "{{ vars.mode }}"

[tasks.setup]
description = "install the pinned tools and sync the locked environment"
run = ["mise install", "uv sync --locked", "npm ci"]

[tasks.check]
description = "lint and type-check"
run = ["uv run ruff check src", "uv run pyright"]

[tasks.build]
description = "build the wheel and the sdist"
depends = ["check"]
run = "uv build"
