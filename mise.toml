[tasks.setup]
run = ["mise install", "uv sync --locked"]

[tasks.vendor]
run = "curl -sSfL https://cdn.jsdelivr.net/gh/lit/dist@${LIT_VERSION}/all/lit-all.min.js -o src/mt/web/assets/lit.min.js"

[tasks.test]
run = [
  "uv run ruff check src",
  "uv run ruff format --check src",
  "uv run pyright",
  "node --check src/mt/web/assets/dashboard.js",
  "node --check src/mt/web/assets/theme.js",
]

[tasks.build]
depends = ["test"]
run = "uv build"

[tasks.deploy]
depends = ["test"]
run = '''
set -euo pipefail

revision="$(git rev-parse --short HEAD)"
if [[ -n "$(git status --porcelain)" ]]; then
  revision="${revision}-dirty"
fi

for service in web bot; do
  for key in $(uv run mt env list --service "$service"); do
    eval "value=\${$key}"
    printf '%s' "$value" \
      | railway variable set "$key" --stdin --service "money-tree-$service" \
        --skip-deploys --json >/dev/null
  done
done

for service in web bot; do
  railway up --service "money-tree-$service" --ci --message "$revision"
done
'''
