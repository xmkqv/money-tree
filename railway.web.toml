[build]
builder = "RAILPACK"
watchPatterns = ["/src/ui/**", "/src/bot/export.py", "/pyproject.toml", "/uv.lock", "/railway.web.toml"]

[deploy]
startCommand = 'uv run --locked --no-sync uvicorn ui.app:create_app --factory --workers 1 --host "" --port "$PORT"'
numReplicas = 1
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
