[build]
builder = "RAILPACK"
watchPatterns = ["/src/ui/**", "/pyproject.toml", "/uv.lock", "/railway.web.toml"]

[deploy]
startCommand = 'uv run --no-sync uvicorn ui.app:create_app --factory --host 0.0.0.0 --port "$PORT"'
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
