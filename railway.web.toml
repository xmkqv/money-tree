[build]
builder = "DOCKERFILE"
watchPatterns = ["/src/ui/**", "/src/bot/export.py", "/pyproject.toml", "/uv.lock", "/Dockerfile", "/railway.web.toml"]

[deploy]
startCommand = 'sh -c "exec env ALLOWED_RAILWAY_EMAILS=jacksawyer1992@gmail.com,m@qxotk.ai uv run --locked --no-sync uvicorn ui.app:create_app --factory --workers 1 --host 0.0.0.0 --port $PORT"'
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
